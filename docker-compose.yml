version: '3.8'

services:
  backend:
    build:
      context: ./app/v4_refactored
      dockerfile: Dockerfile
    container_name: iso-mapper-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/iso_mapper
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      TRANSFORMATION_APPROACH: hybrid
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./app/v4_refactored:/app
      - ./app/v4:/v4
    depends_on:
      - postgres
      - redis
    command: >
      bash -c "pip install -r requirements.txt && 
               uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - iso-mapper-network

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: iso-mapper-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - iso-mapper-network

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: iso-mapper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iso_mapper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iso-mapper-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: iso-mapper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iso-mapper-network

  phoenix:
    image: docker.io/arizephoenix/phoenix:latest
    container_name: iso-mapper-phoenix
    ports:
      - "6006:6006"
    networks:
      - iso-mapper-network

volumes:
  postgres_data:
  redis_data:

networks:
  iso-mapper-network:
    driver: bridge
